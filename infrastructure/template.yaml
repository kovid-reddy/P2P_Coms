AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless signaling only for P2P Beam. No application data is stored or relayed.

Parameters:
  AllowedOrigins:
    Type: String
    Default: ''
    Description: Comma-separated HTTPS frontend origins. Set in production.

Resources:
  PresenceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: OnlinePeers
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  SignalingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../p2p-basic/aws-signaling/
      Handler: app.handler
      Runtime: nodejs20.x
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          PRESENCE_TABLE: !Ref PresenceTable
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          PRESENCE_TTL_SECONDS: '7200'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PresenceTable
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SignalingApi}/*/POST/@connections/*'

  SignalingApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: p2p-signaling
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: '$request.body.type'

  SignalingIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SignalingApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SignalingFunction.Arn}/invocations'

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref SignalingApi, RouteKey: '$connect', AuthorizationType: NONE, Target: !Join [ '/', [ 'integrations', !Ref SignalingIntegration ] ] }
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref SignalingApi, RouteKey: '$disconnect', AuthorizationType: NONE, Target: !Join [ '/', [ 'integrations', !Ref SignalingIntegration ] ] }
  RegisterRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref SignalingApi, RouteKey: register, AuthorizationType: NONE, Target: !Join [ '/', [ 'integrations', !Ref SignalingIntegration ] ] }
  DiscoverRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref SignalingApi, RouteKey: discover, AuthorizationType: NONE, Target: !Join [ '/', [ 'integrations', !Ref SignalingIntegration ] ] }
  SignalRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref SignalingApi, RouteKey: signal, AuthorizationType: NONE, Target: !Join [ '/', [ 'integrations', !Ref SignalingIntegration ] ] }

  SignalingStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref SignalingApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      AccessLogSettings:
        DestinationArn: !GetAtt SignalingLogGroup.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","connectionId":"$context.connectionId"}'

  SignalingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { RetentionInDays: 14 }
  SignalingPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SignalingFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SignalingApi}/*'

Outputs:
  WebSocketUrl:
    Value: !Sub 'wss://${SignalingApi}.execute-api.${AWS::Region}.amazonaws.com'
  PresenceTableName:
    Value: !Ref PresenceTable
